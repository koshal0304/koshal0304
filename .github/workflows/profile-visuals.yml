name: Profile visuals

# Regenerates the live parts of the profile README:
#   • 3D contribution skyline   -> profile-3d-contrib/*.svg
#   • contribution snake        -> assets/generated/snake-{dark,light}.svg
#   • Neural-Dark stats card    -> assets/generated/stats.svg
on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:           # Actions tab → "Run workflow"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-visuals.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake-light.svg?palette=github-light&color_snake=#7c3aed
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4f63,#0891b2,#7c3aed,#c084fc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Neural stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          EXCLUDE_LANGS: ""            # e.g. "HTML,CSS,Jupyter Notebook"
        run: python scripts/generate_stats.py

      - name: Commit refreshed visuals
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets/generated
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile visuals [skip ci]"
            git push
          fi
